services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - growth-mongodb:/data/db

  verdaccio:
    image: verdaccio/verdaccio:6
    ports:
      - "4873:4873"
    volumes:
      - growth-verdaccio:/verdaccio/storage

volumes:
  growth-mongodb:
  growth-verdaccio:
